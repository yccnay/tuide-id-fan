<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TUIDE ID - Premium</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@700;800;900&family=DM+Sans:wght@700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Fredoka',sans-serif}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:22px;background:#f5efe6}
.container{background:#fff;padding:20px;border-radius:20px;max-width:400px;width:100%;margin-bottom:22px;border:2.5px solid #d8c7a8;box-shadow:0 8px 20px rgba(100,80,40,0.15)}
label{font-size:10px;font-weight:800;letter-spacing:1px;opacity:0.6;margin:12px 0 5px;display:block;text-transform:uppercase}
input,select{width:100%;padding:11px 12px;border-radius:11px;border:2px solid #e6d5b8;background:#fffaf0;font-weight:700;color:#3E2723;outline:none;font-size:13px}
.member-grid{display:flex;gap:6px;flex-wrap:wrap}
.m-btn{flex:1;min-width:62px;border:2px solid #e6d5b8;background:#fffaf0;border-radius:10px;padding:8px 2px;font-size:10px;font-weight:800;color:#5a3a1a;cursor:pointer;text-align:center}
.m-btn.active{background:#3E2723;color:#fff;border-color:#3E2723}
.upload{border:2px dashed #d8c7a8;border-radius:11px;padding:10px;text-align:center;background:#fffaf0;position:relative;cursor:pointer;margin-top:6px}
.upload input{position:absolute;inset:0;opacity:0;cursor:pointer}
.upload span{font-size:10px;font-weight:800;color:#8a6a3a}
.btn{width:100%;margin-top:16px;padding:13px;background:linear-gradient(135deg,#d9b779,#8a6a3a);border:none;border-radius:12px;font-weight:900;color:#fff;cursor:pointer}
.card{width:520px;max-width:100%;min-height:340px;background:linear-gradient(180deg,rgba(253,245,225,0.92) 0%, rgba(237,213,168,0.92) 100%);border-radius:26px;border:4px solid #2d1b12;position:relative;overflow:hidden;display:flex;box-shadow:0 0 0 4px #fff, 0 15px 40px rgba(60,30,10,0.25)}
.card-bg{position:absolute;inset:0;background-image:url('tuide.jpg');background-size:cover;background-position:center top;opacity:0.38;z-index:1}
.card-content{position:relative;z-index:3;display:flex;gap:20px;padding:22px;width:100%;align-items:center}
.photo{width:148px;height:205px;border-radius:20px;border:3.5px solid #2d1b12;background:#fff;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,0.2);flex-shrink:0;display:flex;align-items:center;justify-content:center;position:relative}
.photo img{width:100%;height:100%;object-fit:cover;object-position:top center;position:absolute;inset:0}
.ph{font-size:11px;font-weight:900;opacity:0.25;z-index:1;letter-spacing:1px}
.infos{flex:1;display:flex;flex-direction:column;gap:9px}
.info-label{font-family:'DM Sans',sans-serif;font-size:8.5px;font-weight:900;letter-spacing:1.8px;color:#8a5e2a;text-transform:uppercase}
.info-value{font-size:18px;font-weight:900;color:#2d1b12;line-height:1.1;min-height:20px}
.info-value.small{font-size:14.5px;min-height:18px}
.divider{height:1px;background:linear-gradient(90deg,rgba(90,50,20,0.15), transparent);margin:1px 0}
.tag{position:absolute;top:14px;right:16px;z-index:4;background:#2d1b12;color:#f5e6c8;font-size:10px;font-weight:900;padding:6px 14px;border-radius:20px;letter-spacing:1.5px}
#result{margin-top:20px;display:none;text-align:center;max-width:520px;width:100%}
#result img{width:100%;border-radius:22px;border:4px solid #2d1b12}
</style>
</head>
<body>
<div class="container">
 <h3 style="text-align:center;font-weight:900;color:#2d1b12;margin-bottom:14px">TUIDE ID - PREMIUM ♡</h3>
 <label>Choose Your Utt</label>
 <div class="member-grid"><div class="m-btn" onclick="sel('sohee')" id="btn-sohee">SEOHEE</div><div class="m-btn" onclick="sel('soyeon')" id="btn-soyeon">SEOYEON</div><div class="m-btn" onclick="sel('elena')" id="btn-elena">ELENA</div><div class="m-btn" onclick="sel('jia')" id="btn-jia">JIA</div><div class="m-btn" onclick="sel('misaki')" id="btn-misaki">MISAKI</div><div class="m-btn" onclick="sel('seah')" id="btn-seah">SEAH</div><div class="m-btn" onclick="sel('hani')" id="btn-hani">YI HANI</div></div>
 <div class="upload"><span>📁 OR CHOOSE UTT PHOTO FROM GALLERY</span><input type="file" id="fileUtt" accept="image/*"></div>
 <label>Fan Name</label><input id="inName" placeholder="Your name" oninput="up()">
 <div style="display:flex;gap:8px"><div style="flex:1"><label>Birth Year</label><input id="inBirth" placeholder="2009" oninput="up()"></div><div style="flex:1"><label>Country</label><input id="inCountry" placeholder="BR 🇧🇷" oninput="up()"></div></div>
 <label>Fav Song</label><select id="inSong" onchange="up()"><option value=""></option><option>GRLS</option><option>SUN KISS</option><option>FLIP-FLOP GIRLS</option><option>ECHO</option><option>ABD</option></select>
 <button class="btn" onclick="save()">SAVE ID 💾</button>
 <div id="result"><p style="font-size:12px;font-weight:800;margin:12px 0 8px">👇 Hold to save!</p><img id="resImg"></div>
</div>
<div class="card" id="card">
 <div class="card-bg"></div>
 <div class="tag">TUNE&PLAY</div>
 <div class="card-content">
  <div class="photo" id="photoArea"><span class="ph">PHOTO</span></div>
  <div class="infos">
   <div><div class="info-label">Fan Name</div><div class="info-value" id="cName"></div></div>
   <div class="divider"></div>
   <div><div class="info-label">Birth</div><div class="info-value small" id="cBirthOnly"></div></div>
   <div><div class="info-label">Country</div><div class="info-value small" id="cCountryOnly"></div></div>
   <div class="divider"></div>
   <div><div class="info-label">My Utt</div><div class="info-value" id="cUtt"></div></div>
   <div><div class="info-label">Fav Song</div><div class="info-value" id="cSong"></div></div>
  </div>
 </div>
</div>
<script>
let utt='';
document.getElementById('fileUtt').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{document.getElementById('photoArea').innerHTML=`<img src="${ev.target.result}">`};r.readAsDataURL(f)});
function sel(name){utt=name.toUpperCase();document.querySelectorAll('.m-btn').forEach(b=>b.classList.remove('active'));document.getElementById('btn-'+name).classList.add('active');document.getElementById('photoArea').innerHTML=`<img src="${name}.jpg" onerror="this.src='${name}.jpeg'">`;up()}
function up(){
 document.getElementById('cName').textContent=document.getElementById('inName').value;
 document.getElementById('cBirthOnly').textContent=document.getElementById('inBirth').value;
 document.getElementById('cCountryOnly').textContent=document.getElementById('inCountry').value;
 document.getElementById('cUtt').textContent=utt;
 document.getElementById('cSong').textContent=document.getElementById('inSong').value;
}
function save(){html2canvas(document.getElementById('card'),{scale:3,useCORS:true,backgroundColor:null}).then(c=>{const d=c.toDataURL('image/png');document.getElementById('resImg').src=d;document.getElementById('result').style.display='block';const a=document.createElement('a');a.download='tuide-id.png';a.href=d;a.click()})}
up();
</script>
</body>
</html>
